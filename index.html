[['cart','Cart','<path d="M4 5h2l2 10h10l2-7H7"/><circle cx="10" cy="19" r="1"/><circle cx="17" cy="19" r="1"/>'],['heart','Favourites','<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.500-7 10-7 10z"/>'],['bag','Library','<path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/>'],['dots','More','<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>']].forEach(([k,l,d])=>{const b=document.createElement('button');b.className='ib';b.id='b-'+k;b.setAttribute('aria-label',l);b.innerHTML=ic(d)+'<span class="bd"></span>';$('#icons').append(b);BADGES[k]=b.querySelector('.bd')});
function badge(k,n){const e=BADGES[k];if(e.textContent==n)return;e.textContent=n;e.classList.toggle('has',n>0);e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}
const counts=()=>{badge('cart',cart.size);badge('heart',favs.size);badge('bag',saved.length);$('#b-heart').classList.toggle('fav',favs.has(S.look))};
$('#b-bag').onclick=()=>$('#lib').classList.toggle('open');
$('#b-dots').onclick=()=>$('#more').classList.toggle('open');
[['Share look','Share link copied'],['Export render','Exported 4K render'],['Duplicate','Duplicated as new VELL'],['Settings','Settings saved']].forEach(([n,t])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{$('#more').classList.remove('open');toast(t)};$('#more').append(b)});
/* profile */
const IDS=[['Han Seo-yeon',23,'Seoul, KR','14掳C'],['Kim Ha-eun',22,'Busan, KR','17掳C'],['Yoon Ji-woo',25,'Seoul, KR','12掳C'],['Park Min-ji',24,'Incheon, KR','13掳C'],['Lee Soo-ah',21,'Daegu, KR','15掳C']];let idk=0,rot=0;
function avatar(){const k=98/360,u=H(LOOKS[S.look].f,1000);Object.assign($('#avatar').style,{backgroundImage:`url(${u})`,backgroundSize:`${1360*k}px ${2048*k}px`,backgroundPosition:`${-500*k}px ${-46*k}px`})}
$('#pen').onclick=()=>{const n=$('#name');if(n.classList.contains('edit')){n.contentEditable='false';n.classList.remove('edit');toast('Name updated')}else{n.contentEditable='true';n.classList.add('edit');n.focus();getSelection().selectAllChildren(n)}};
$('#name').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();$('#pen').click()}};
$('#shuf').onclick=()=>{idk=(idk+1)%IDS.length;rot+=180;$('#shuf').style.transform=`rotate(${rot}deg)`;const t=IDS[idk],ab='abcdefghijklmnopqrstuvwxyz';let f=0;const iv=setInterval(()=>{f++;$('#name').textContent=f<14?[...t[0]].map(c=>c==' '||c=='-'?c:ab[Math.random()*26|0]).join(''):t[0];if(f>=14){clearInterval(iv);$('#age').textContent=t[1];$('#city').textContent=t[2];$('#temp').textContent=t[3]}},40)};
/* side menu */
const SIDE=[['Face','<circle cx="12" cy="12" r="8"/><path d="M9 14c1 1.500 5 1.500 6 0"/>'],['Hair','<path d="M5 14c0-6 4-9 7-9s7 3 7 9"/>'],['Makeup','<path d="M9 21V10h6v11zM10 10V4h4v6"/>'],['Body','<circle cx="12" cy="5" r="2"/><path d="M12 8v7M8 10h8M9 21l3-6 3 6"/>'],['Outfits','<path d="M8 4l-5 4 3 3 2-1v10h8V10l2 1 3-3-5-4a4 4 0 01-8 0z"/>'],['Accessories','<circle cx="12" cy="12" r="6"/>'],['Tattoos','<path d="M12 3c4 4 6 7 0 18C6 10 8 7 12 3z"/>'],['Details','<path d="M4 6h16M4 12h16M4 18h16"/>']];
SIDE.forEach(([n,d],i)=>{const b=document.createElement('button');b.innerHTML=ic(d)+n;b.onclick=()=>{$('#sideInd').style.top=10+i*56+'px';$$('#side button').forEach(x=>x.classList.toggle('on',x==b));n=='Outfits'?show('outfits'):n=='Body'?bodyView():tune(n)};$('#side').append(b)});
$('#sideInd').style.top=10+4*56+'px';$$('#side button')[4].classList.add('on');
$('#rand').onclick=()=>pickLook(Math.random()*8|0,true);
/* panel views */
function show(v){$('#v-outfits').classList.toggle('hide',v!='outfits');$('#v-tune').classList.toggle('hide',v=='outfits')}
const SW={Hair:['#14110f','#3b2a20','#6b4a35','#a07c5a','#d9c3a1'],Makeup:['#e8b4a8','#d98c8c','#b5525e','#8e3c4a']};
function viewHTML(title,note,sw,opts,sls){return `<h3>${title}<small>${note}</small></h3>`+(sw?`<div class="sw">${sw.map((c,i)=>`<i style="background:${c}" class="${i?'':'on'}"></i>`).join('')}</div>`:'')+(opts?`<div class="opts">${opts.map((o,i)=>`<button class="opt ${i?'':'on'}">${o}</button>`).join('')}</div>`:'')+(sls||[]).map(([n,min,max,v,id])=>`<div class="sl">${n}<input type="range" min="${min}" max="${max}" value="${v}" ${id?`data-k="${id}"`:''}></div>`).join('')}
function wire(){const v=$('#v-tune');v.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>{v.querySelectorAll('.sw i').forEach(x=>x.classList.toggle('on',x==i));rescan()});v.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{v.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x==o));rescan()});v.querySelectorAll('input').forEach(r=>r.oninput=()=>{const k=r.dataset.k,r2=document.documentElement.style;if(k=='h')r2.setProperty('--height',r.value/100);if(k=='b')r2.setProperty('--build',r.value/100)});v.querySelectorAll('input:not([data-k])').forEach(r=>r.onchange=rescan)}
function tune(n){$('#v-tune').innerHTML=viewHTML(n,'changes re-render the model',SW[n],['Classic','Soft','Bold'],[['Intensity',0,100,50],['Detail',0,100,50]]);wire();show('tune')}
function bodyView(){$('#v-tune').innerHTML=viewHTML('Body','changes re-render the model',null,null,[['Height',94,106,100,'h'],['Build',92,110,100,'b']]);wire();show('tune')}
function tabView(){const t=TABS[tab];if(t=='STYLE')return show('outfits');if(t=='BODY')return bodyView();const seed='VL-0'+(400+idk*37)+'-KR';$('#v-tune').innerHTML=`<h3>${t}<small>${t=='DNA'?seed:''}</small></h3><p class="txt">${{DNA:'Seed '+seed+' defines this character.',PERSONALITY:'Personality traits appear here.',STORY:'Her story appears here.'}[t]}</p>`;show('tune')}
/* outfits */
CATS.forEach(([k,n,e])=>{const b=document.createElement('button');b.className='chip'+(k=='all'?' on':'');b.innerHTML=`<i>${e}</i>${n}`;b.onclick=()=>{cat=k;$$('.chip').forEach(x=>x.classList.toggle('on',x==b));filterGrid()};$('#chips').append(b)});
LOOKS.forEach((l,i)=>{const c=document.createElement('div');c.className='card';c.dataset.i=i;c.innerHTML=`<div class="im" style="background-image:url(${H(l.f,360)})"></div><div class="nt">${l.n}</div><div class="hr">鈾�</div>`;c.onclick=()=>pickLook(i);c.ondblclick=()=>{favs.has(i)?favs.delete(i):favs.add(i);favState()};$('#grid').append(c)});
function favState(){$$('.card').forEach((c,i)=>c.classList.toggle('fav',favs.has(i)));counts()}
function filterGrid(){let n=0;$$('.card').forEach((c,i)=>{const m=cat=='all'||LOOKS[i].c==cat;if(m){c.classList.remove('hid','out');c.classList.remove('re');void c.offsetWidth;c.style.animationDelay=n++*45+'ms';c.classList.add('re')}else{c.classList.add('out');setTimeout(()=>{if(c.classList.contains('out'))c.classList.add('hid')},300)}});$('#cnt').textContent=n+(n==1?' look':' looks')}
function renderAcc(){const p=LOOKS[S.look].p;$('#acc').innerHTML='';GROUPS.forEach(([k,n])=>{const items=p[k]||[],r=document.createElement('div');r.className='row'+(openRow==k?' open':'');r.dataset.k=k;r.innerHTML=`<button>${n}${items.length?`<em>路 ${items.length}</em>`:''}<svg class="ic ch" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="rb2"><div>${items.length?items.map(([a,c,pr],j)=>{const id=S.look+k+j;return `<div class="it"><span>${a} <small>${c}</small></span><b>$${pr}</b><button data-id="${id}" class="${cart.has(id)?'in':''}">${cart.has(id)?'鉁�':'+'}</button></div>`}).join(''):'<div class="none">Nothing in this look</div>'}</div></div>`;r.firstChild.onclick=()=>{openRow=openRow==k?null:k;$$('.row').forEach(x=>x.classList.toggle('open',x.dataset.k==openRow))};r.querySelectorAll('.it button').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(cart.has(id)){cart.delete(id);b.textContent='+';b.classList.remove('in')}else{cart.add(id);b.textContent='鉁�';b.classList.add('in');toast('Added to cart')}counts()});$('#acc').append(r)})}
function hotspots(){const p=LOOKS[S.look].p;$('#hotspots').innerHTML='';for(const k in HS){if(!(p[k]||[]).length)continue;const h=document.createElement('button');h.className='hs';h.style.left=HS[k][0]+'%';h.style.top=HS[k][1]+'%';h.innerHTML='<i>'+p[k].map(([a,c,pr])=>`<b>${a}</b> 路 ${c} 路 $${pr}`).join('<br>')+'</i>';h.onclick=()=>{show('outfits');openRow=k;$$('.row').forEach(x=>x.classList.toggle('open',x.dataset.k==k))};$('#hotspots').append(h)}}
function rescan(){const s=$('#scan');s.classList.remove('go');void s.offsetWidth;s.classList.add('go')}
let shown=-1;
async function showLook(i){const t=++token;$$('.card').forEach((c,j)=>c.classList.toggle('on',j==i));try{await IMGS[i].decode()}catch(e){}if(t!=token)return;const f=document.createElement('div');f.className='fig in';f.style.backgroundImage=`url(${IMGS[i].src})`;f.style.filter='var(--real)';$('#figs').append(f);rescan();f.addEventListener('animationend',()=>{[...$('#figs').children].forEach(x=>{if(x!=f)x.remove()});f.classList.remove('in')});shown=i;renderAcc();hotspots();favState();avatar();faces()}
function commit(){hist=hist.slice(0,hi+1);hist.push({...S});hi=hist.length-1;hbtn()}
function hbtn(){$('#undo').disabled=hi==0;$('#redo').disabled=hi==hist.length-1}
function pickLook(i,force){if(i==S.look&&!force)return;S.look=i;showLook(i);commit()}
function apply(){showLook(S.look);applyFilter();applyReal()}
$('#undo').onclick=()=>{if(hi>0){S={...hist[--hi]};apply();hbtn()}};
$('#redo').onclick=()=>{if(hi<hist.length-1){S={...hist[++hi]};apply();hbtn()}};
$('#pose').onclick=()=>{const w=$('#modelWrap'),c=w.classList.contains('full')?'mid':w.classList.contains('mid')?'portrait':'full';w.className=c};
$('#reset').onclick=()=>{S={look:0,filter:0,real:0};$('#real').value=0;apply();commit()};
/* filter + realism */
function faces(){const m=$('#filtMenu');m.innerHTML='';const u=H(LOOKS[S.look].f,1000),k=76/360;FILTERS.forEach(([n,f,t],i)=>{const b=document.createElement('button');b.className=i==S.filter?'on':'';b.innerHTML=`<i style="background-image:url(${u});background-size:${1360*k*1.2}px ${2048*k*1.2}px;background-position:${-500*k*1.2}px ${-46*k*1.2}px;filter:${f};background-color:rgba(255,255,255,.2)"></i>${n}`;b.onclick=()=>{S.filter=i;applyFilter();commit();faces();m.classList.remove('open')};m.append(b)})}
$('#filt').onclick=()=>$('#filtMenu').classList.toggle('open');
function applyFilter(){const [,f,t]=FILTERS[S.filter];$('#grade').style.filter=f;$('#tint').style.background=t}
function applyReal(){const v=S.real/100;document.documentElement.style.setProperty('--real',v?`saturate(${1-v*.35}) contrast(${1+v*.15}) blur(${v*.6}px)`:'none')}
$('#real').oninput=e=>{S.real=+e.target.value;applyReal()};$('#real').onchange=commit;
/* save */
$('#save').onclick=()=>{saved.push(LOOKS[S.look].n);$('#lib').innerHTML=saved.map(n=>`<p>${n}</p>`).join('');counts();toast('Saved to library')};
/* init */
document.fonts&&document.fonts.ready.then(place);place();filterGrid();$$('.card')[0].classList.add('on');showLook(0);applyFilter();hbtn();counts();
</script></body></html>
